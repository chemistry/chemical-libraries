name: Release Build

on:
  pull_request_target:
    types: [closed]
    branches: [master]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v3.0.1)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  create-tag:
    if: >
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version from branch
        id: extract
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          VERSION=$(echo "$BRANCH" | sed 's|release/auto-v||')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.extract.outputs.tag }}" -m "Release ${{ steps.extract.outputs.tag }}"
          git push origin "${{ steps.extract.outputs.tag }}"

  publish:
    needs: [create-tag]
    # create-tag 'skipped' alone is NOT enough: on pull_request_target it skips
    # for EVERY merged non-release PR, which used to fire a publish attempt with
    # an empty tag. Only tag pushes, manual dispatches, and merged release/* PRs
    # may publish.
    if: >
      always() &&
      (needs.create-tag.result == 'success' ||
       (needs.create-tag.result == 'skipped' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.create-tag.outputs.tag || github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ needs.create-tag.outputs.version }}" ]; then
            echo "version=${{ needs.create-tag.outputs.version }}" >> $GITHUB_OUTPUT
            echo "tag=${{ needs.create-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            VERSION=$(echo "$TAG" | sed 's/^v//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          else
            TAG=$(echo "${{ github.ref }}" | sed 's|refs/tags/||')
            VERSION=$(echo "$TAG" | sed 's/^v//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Publish packages to npm
        run: |
          # Publish in dependency order; tolerate ONLY already-published (idempotent
          # re-runs), fail the job on anything else (auth, network, registry).
          publish() {
            local OUT
            if OUT=$(npm publish -w "$1" --access public 2>&1); then
              echo "$1 published"
            elif echo "$OUT" | grep -qE "EPUBLISHCONFLICT|cannot publish over the previously published"; then
              echo "$1 already published - ok"
            else
              echo "$OUT"
              echo "::error::npm publish failed for $1"
              exit 1
            fi
          }
          publish @chemistry/common
          publish @chemistry/elements
          publish @chemistry/space-groups
          publish @chemistry/math
          publish @chemistry/formula
          publish @chemistry/molecule
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
